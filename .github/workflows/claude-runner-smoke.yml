name: Claude runner smoke

# 手動驗證 Skill 的 claude_runner 能以 claude-sonnet-5-5 完成一筆合成翻譯與審查。
# 只處理程式內建的合成資料，每次最多兩次 Messages API 請求。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SKILL_SHA: 566acf556751903ebd0a536dd77f1b67bef6deaa
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: SyuanTsai/Skill-Darktide-Translate
          ref: 566acf556751903ebd0a536dd77f1b67bef6deaa
          path: skill
          persist-credentials: false
      - name: Verify pinned Skill commit
        shell: bash
        working-directory: skill
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          echo "Skill HEAD: $head"
          test "$head" = "$SKILL_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        shell: bash
        working-directory: skill/packages/claude-runner
        run: python -m pip install --no-cache-dir -r requirements.lock
      - name: Live synthetic smoke
        shell: bash
        working-directory: skill/packages/claude-runner
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -B -m claude_runner.smoke --live
