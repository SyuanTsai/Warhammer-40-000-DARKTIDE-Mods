name: MOD update tests

on:
  pull_request:
    paths:
      - 'scripts/localization_lint/**'
      - 'scripts/mod_update_watch/**'
      - 'scripts/mod_update_orchestrate/**'
      - '.github/workflows/mod-update-*.yml'
      - '.github/workflows/mod-drive-intake.yml'
      - '.github/workflows/mod-private-fix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: mods
    env:
      SKILL_ROOT: ${{ github.workspace }}/.skill
    steps:
      - uses: actions/checkout@v4
        with:
          path: mods
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: SyuanTsai/Skill-Darktide-Translate
          ref: 59ae554bd9977ae0ab293ca8ae26297750aeb5e4
          path: .skill
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Install Skill dependencies
        run: |
          pwsh --version
          python -m pip install -r "$SKILL_ROOT/packages/claude-runner/requirements.lock"
      - name: Check for undefined Python names
        run: |
          python -m pip install flake8
          python -m flake8 --select=F821 scripts/mod_update_watch scripts/mod_update_orchestrate
      - name: Run MOD update watch tests
        run: python -m unittest discover -s scripts/mod_update_watch/tests -t .
      - name: Run localization lint tests
        run: python -m unittest discover -s scripts/localization_lint/tests -t .
      - name: Run MOD update orchestrate tests
        run: python -m unittest discover -s scripts/mod_update_orchestrate/tests -t .
